<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>💑 我们的私密空间</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- ==================== 登录页 ==================== -->
  <div id="loginPage" class="page active">
    <div class="login-container">
      <div class="login-header">
        <div class="login-icon">💑</div>
        <h1>我们的私密空间</h1>
        <p class="login-subtitle">只属于两个人的小世界</p>
      </div>
      <div class="login-form">
        <div class="form-group">
          <label>账号</label>
          <input type="text" id="loginUsername" placeholder="boy 或 girl" autocomplete="username">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="输入密码" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-block" onclick="handleLogin()">进入我们的空间</button>
        <p class="login-hint">初始账号: boy / girl | 密码: 123456</p>
      </div>
    </div>
  </div>

  <!-- ==================== 主应用 ==================== -->
  <div id="mainApp" class="page">
    <!-- 顶部状态栏 -->
    <header class="app-header">
      <div class="header-left">
        <span class="partner-status" id="partnerStatus">●</span>
        <span id="partnerName">对方</span>
      </div>
      <div class="header-center">
        <span class="app-title">💑 我们的空间</span>
      </div>
      <div class="header-right">
        <button class="btn-icon" onclick="showSettings()" title="设置">⚙️</button>
      </div>
    </header>

    <!-- 主体内容区域 -->
    <main class="app-main">
      <!-- 聊天页 -->
      <div id="chatPage" class="tab-page active">
        <div class="chat-messages" id="chatMessages">
          <div class="chat-empty">
            <div class="empty-icon">💬</div>
            <p>还没有消息，来说第一句话吧~</p>
          </div>
        </div>
        <div class="chat-typing" id="chatTyping" style="display:none;">
          <span class="typing-dots"><span></span><span></span><span></span></span>
          <span id="typingName"></span> 正在输入...
        </div>
        <div class="chat-input-area">
          <div class="chat-preview" id="chatPreview" style="display:none;">
            <img id="chatPreviewImg" src="" alt="">
            <span id="chatPreviewName"></span>
            <button class="btn-close" onclick="clearChatPreview()">✕</button>
          </div>
          <div class="chat-input-row">
            <button class="btn-icon" onclick="document.getElementById('chatFileInput').click()" title="发送文件/图片">📎</button>
            <input type="file" id="chatFileInput" style="display:none" accept="image/*,.pdf,.doc,.docx,.txt,.zip" onchange="handleChatFile(event)">
            <textarea id="chatInput" rows="1" placeholder="说点什么..." onkeydown="handleChatKeydown(event)" oninput="autoResize(this)"></textarea>
            <button class="btn-icon btn-send" onclick="sendMessage()" title="发送">📨</button>
          </div>
        </div>
      </div>

      <!-- 日记页 -->
      <div id="diaryPage" class="tab-page">
        <div class="page-toolbar">
          <h2>📖 我们的日记</h2>
          <button class="btn btn-primary btn-sm" onclick="showDiaryEditor()">写日记</button>
        </div>
        <div class="diary-list" id="diaryList">
          <div class="empty-state">
            <div class="empty-icon">📝</div>
            <p>还没有日记，记录你们的每一天吧~</p>
          </div>
        </div>
      </div>

      <!-- 相册页 -->
      <div id="albumPage" class="tab-page">
        <div class="page-toolbar">
          <h2>📸 我们的相册</h2>
          <button class="btn btn-primary btn-sm" onclick="document.getElementById('albumFileInput').click()">上传照片</button>
          <input type="file" id="albumFileInput" style="display:none" accept="image/*" multiple onchange="handleAlbumUpload(event)">
        </div>
        <div class="album-grid" id="albumGrid">
          <div class="empty-state">
            <div class="empty-icon">🖼️</div>
            <p>还没有照片，上传你们的甜蜜瞬间吧~</p>
          </div>
        </div>
      </div>

      <!-- 纪念日页 -->
      <div id="remindersPage" class="tab-page">
        <div class="page-toolbar">
          <h2>💕 纪念日</h2>
          <button class="btn btn-primary btn-sm" onclick="showReminderEditor()">添加</button>
        </div>
        <div class="reminder-list" id="reminderList">
          <div class="empty-state">
            <div class="empty-icon">📅</div>
            <p>还没有纪念日，添加你们的特别日子吧~</p>
          </div>
        </div>
      </div>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('chat')" data-tab="chat">
        <span class="nav-icon">💬</span>
        <span class="nav-label">聊天</span>
      </button>
      <button class="nav-item" onclick="switchTab('diary')" data-tab="diary">
        <span class="nav-icon">📖</span>
        <span class="nav-label">日记</span>
      </button>
      <button class="nav-item" onclick="switchTab('album')" data-tab="album">
        <span class="nav-icon">📸</span>
        <span class="nav-label">相册</span>
      </button>
      <button class="nav-item" onclick="switchTab('reminders')" data-tab="reminders">
        <span class="nav-icon">💕</span>
        <span class="nav-label">纪念日</span>
      </button>
    </nav>
  </div>

  <!-- ==================== 日记编辑器弹窗 ==================== -->
  <div id="diaryEditorModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="diaryEditorTitle">写日记</h3>
        <button class="btn-close" onclick="closeDiaryEditor()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <input type="text" id="diaryTitle" placeholder="日记标题">
        </div>
        <div class="form-group">
          <label>今天的心情</label>
          <div class="mood-selector" id="moodSelector">
            <span class="mood-option selected" data-mood="😊">😊</span>
            <span class="mood-option" data-mood="🥰">🥰</span>
            <span class="mood-option" data-mood="😢">😢</span>
            <span class="mood-option" data-mood="😤">😤</span>
            <span class="mood-option" data-mood="🤩">🤩</span>
            <span class="mood-option" data-mood="😴">😴</span>
          </div>
        </div>
        <div class="form-group">
          <textarea id="diaryContent" rows="8" placeholder="写下今天的故事..."></textarea>
        </div>
        <div class="form-group">
          <label>配图（可选）</label>
          <input type="file" id="diaryImageInput" accept="image/*" onchange="previewDiaryImage(event)">
          <img id="diaryImagePreview" style="display:none; max-width:100%; margin-top:8px; border-radius:8px;">
        </div>
        <input type="hidden" id="diaryEditId">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeDiaryEditor()">取消</button>
        <button class="btn btn-primary" onclick="saveDiary()">保存</button>
      </div>
    </div>
  </div>

  <!-- ==================== 纪念日编辑器弹窗 ==================== -->
  <div id="reminderEditorModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="reminderEditorTitle">添加纪念日</h3>
        <button class="btn-close" onclick="closeReminderEditor()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>标题</label>
          <input type="text" id="reminderTitle" placeholder="例如：恋爱纪念日">
        </div>
        <div class="form-group">
          <label>描述（可选）</label>
          <input type="text" id="reminderDesc" placeholder="甜蜜备注...">
        </div>
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="reminderDate">
        </div>
        <div class="form-group">
          <label>类型</label>
          <select id="reminderType">
            <option value="anniversary">纪念日</option>
            <option value="date">约会</option>
            <option value="reminder">提醒</option>
          </select>
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="reminderRecurring" checked>
            每年重复
          </label>
        </div>
        <input type="hidden" id="reminderEditId">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeReminderEditor()">取消</button>
        <button class="btn btn-primary" onclick="saveReminder()">保存</button>
      </div>
    </div>
  </div>

  <!-- ==================== 设置弹窗 ==================== -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ 设置</h3>
        <button class="btn-close" onclick="closeSettings()">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-info">
          <p>当前登录: <strong id="settingsUsername"></strong>（<span id="settingsDisplayName"></span>）</p>
        </div>
        <div class="form-group">
          <label>修改密码</label>
          <input type="password" id="oldPassword" placeholder="原密码">
          <input type="password" id="newPassword" placeholder="新密码" style="margin-top:8px;">
          <button class="btn btn-primary btn-sm" onclick="changePassword()" style="margin-top:8px;">修改密码</button>
        </div>
        <hr>
        <button class="btn btn-danger btn-block" onclick="logout()">退出登录</button>
      </div>
    </div>
  </div>

  <!-- ==================== 图片预览弹窗 ==================== -->
  <div id="imagePreviewModal" class="modal modal-image" onclick="closeImagePreview()">
    <img id="imagePreviewFull" src="" alt="">
    <button class="btn-close btn-close-light" onclick="closeImagePreview()">✕</button>
  </div>

  <!-- ==================== Toast ==================== -->
  <div id="toast" class="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
